[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "project-genome"
version = "0.1.0"
description = "A project's knowledge genome: one CLI, documentation roles with owners and mutability classes, and the machinery that keeps them true."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Ishan Parihar" }]
keywords = [
    "documentation",
    "knowledge-management",
    "agents",
    "governance",
    "lint",
    "records",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: System :: Software Distribution",
]
# The CLI is stdlib only — that is the property that makes it installable anywhere
# with no dependency resolution and no build surprises. Keep this list empty.
dependencies = []

[project.urls]
Homepage = "https://github.com/ishan-parihar/project-genome"
Repository = "https://github.com/ishan-parihar/project-genome"
Issues = "https://github.com/ishan-parihar/project-genome/issues"
Funding = "https://github.com/sponsors/ishan-parihar"

[project.scripts]
genome = "project_genome:main"

[tool.hatch.build.targets.wheel]
# The artifact is ONE file: scripts/genome, built from src/ by scripts/build.py.
# Shipping that same file (not a re-implementation as an importable package) keeps
# the promise that a pip-installed genome and a vendored genome are the same bytes,
# which is what the release checksums in scripts/releases.txt compare against.
# The wrapper package (project_genome/) carries the entry point; the CLI file is
# force-included under it as _genome.py.
packages = ["project_genome"]

[tool.hatch.build.targets.wheel.force-include]
"scripts/genome" = "project_genome/_genome.py"

[tool.hatch.build.targets.sdist]
include = [
    "project_genome/",
    # THE SCRIPTS DIRECTORY, DERIVED — measured 2026-11-05.
    #
    # This list used to enumerate every file under scripts/ one by one, and
    # that enumeration was a defect that fired THREE times:
    #   1. scripts/docs/ was missing, so the sdist shipped check_docs_lint.py
    #      without the two files it exists to test, and the shipped suite
    #      died on arrival with 4 hard D001 findings;
    #   2. scripts/mutation_install_sh.py was missing, so the sdist shipped
    #      mutation_check.py without the module it imports;
    #   3. scripts/mutation_append_only.py was missing — the SAME defect
    #      class, recurring, found by the sdist case on the acceptance run.
    #
    # Each time, the fix was to ADD ONE MORE LINE BY HAND. That is not a
    # fix, it is a repair with no guard: the next sibling module a suite
    # imports would be forgotten the same way. A directory entry ships the
    # whole directory, so the list now DERIVES the scripts set from the tree
    # instead of restating it, and the class cannot recur.
    #
    # MEASURED, on a clone: with "scripts/" the sdist ships all 21 tracked
    # files under it, and a NEW sibling module added to the tree ships with
    # NO list edit — which is the whole point. test_package then ran 10/10,
    # including the sdist case that had been failing.
    #
    # NOTE ON HOW THIS LIST WORKS, measured 2026-11-05: a NON-EMPTY `include`
    # list RESTRICTS the sdist to the patterns in it. An EMPTY list means
    # "everything git tracks" — so emptying this list would ship MORE, not
    # fewer, and the list is not decorative. It is also not a glob list: the
    # entries are paths, and a directory entry ships the whole directory.
    "scripts/",
    # The files README.md links to, because the sdist ships README.md AND ships
    # the gate that checks it — and that gate FAILED on the sdist it shipped in:
    # 4 hard D001 findings, because AGENTS.md, docs/RUNBOOK.md,
    # docs/ARCHITECTURE.md and assets/genome-wake.png were not in the sdist.
    # Measured 2026-11-05; the closure is 4 files, 84018 bytes, and it closes
    # in one round with 0 findings remaining. Shipping the README without what
    # it points at is the same defect one level up: a document that reads
    # green in the repo and is broken for anyone who extracts it.
    "AGENTS.md",
    "assets/genome-wake.png",
    "docs/ARCHITECTURE.md",
    "docs/RUNBOOK.md",
    "src/",
    "blueprints/",
    "references/",
    "docs/PUBLISHING.md",
    "SKILL.md",
    "README.md",
    "LICENSE",
    "FUNDING.yml",
    "install.sh",
    "install.ps1",
    "pyproject.toml",
]
