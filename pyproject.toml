[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "project-genome"
version = "0.1.0"
description = "A project's knowledge genome: one CLI, documentation roles with owners and mutability classes, and the machinery that keeps them true."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Ishan Parihar" }]
keywords = [
    "documentation",
    "knowledge-management",
    "agents",
    "governance",
    "lint",
    "records",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: System :: Software Distribution",
]
# The CLI is stdlib only — that is the property that makes it installable anywhere
# with no dependency resolution and no build surprises. Keep this list empty.
dependencies = []

[project.urls]
Homepage = "https://github.com/ishan-parihar/project-genome"
Repository = "https://github.com/ishan-parihar/project-genome"
Issues = "https://github.com/ishan-parihar/project-genome/issues"
Funding = "https://github.com/sponsors/ishan-parihar"

[project.scripts]
genome = "project_genome:main"

[tool.hatch.build.targets.wheel]
# The artifact is ONE file: scripts/genome, built from src/ by scripts/build.py.
# Shipping that same file (not a re-implementation as an importable package) keeps
# the promise that a pip-installed genome and a vendored genome are the same bytes,
# which is what the release checksums in scripts/releases.txt compare against.
# The wrapper package (project_genome/) carries the entry point; the CLI file is
# force-included under it as _genome.py.
packages = ["project_genome"]

[tool.hatch.build.targets.wheel.force-include]
"scripts/genome" = "project_genome/_genome.py"

[tool.hatch.build.targets.sdist]
include = [
    "project_genome/",
    "scripts/genome",
    "scripts/releases.txt",
    "scripts/build.py",
    "scripts/test_genome.py",
    "src/",
    "blueprints/",
    "references/",
    "docs/PUBLISHING.md",
    "SKILL.md",
    "README.md",
    "LICENSE",
    "FUNDING.yml",
    "install.sh",
    "install.ps1",
    "pyproject.toml",
]
