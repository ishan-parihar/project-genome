[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "project-genome"
version = "0.1.0"
description = "A project's knowledge genome: one CLI, documentation roles with owners and mutability classes, and the machinery that keeps them true."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Ishan Parihar" }]
keywords = [
    "documentation",
    "knowledge-management",
    "agents",
    "governance",
    "lint",
    "records",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: System :: Software Distribution",
]
# The CLI is stdlib only — that is the property that makes it installable anywhere
# with no dependency resolution and no build surprises. Keep this list empty.
dependencies = []

[project.urls]
Homepage = "https://github.com/ishan-parihar/project-genome"
Repository = "https://github.com/ishan-parihar/project-genome"
Issues = "https://github.com/ishan-parihar/project-genome/issues"
Funding = "https://github.com/sponsors/ishan-parihar"

[project.scripts]
genome = "project_genome:main"

[tool.hatch.build.targets.wheel]
# The artifact is ONE file: scripts/genome, built from src/ by scripts/build.py.
# Shipping that same file (not a re-implementation as an importable package) keeps
# the promise that a pip-installed genome and a vendored genome are the same bytes,
# which is what the release checksums in scripts/releases.txt compare against.
# The wrapper package (project_genome/) carries the entry point; the CLI file is
# force-included under it as _genome.py.
packages = ["project_genome"]

[tool.hatch.build.targets.wheel.force-include]
"scripts/genome" = "project_genome/_genome.py"

[tool.hatch.build.targets.sdist]
include = [
    "project_genome/",
    "scripts/genome",
    "scripts/releases.txt",
    "scripts/build.py",
    "scripts/test_genome.py",
    "scripts/test_package.py",
    "scripts/test_package_modes.py",
    "scripts/check_docs_lint.py",
    "scripts/check_suite_counts.py",
    "scripts/check_ps1.py",
    "scripts/mutation_check.py",
    # The mutation runner that `mutation_check.py` imports. Measured 2026-11-05:
    # the sdist shipped mutation_check.py WITHOUT it, so running the shipped
    # suite in the extracted sdist died with "ModuleNotFoundError: No module
    # named 'mutation_install_sh'". The same defect class as the docs gate
    # below — a shipped suite whose subject is absent — found by RULE 2 of
    # the sdist case, because the import is not a module-level `Path` binding
    # and so RULE 1 cannot see it.
    "scripts/mutation_install_sh.py",
    # The docs gate itself, because the suite that tests it ships in this sdist.
    # Measured 2026-11-05: `check_docs_lint.py` was listed here but the two files
    # it exists to test were not, so the sdist carried a suite whose subjects were
    # absent and running it there died on its first case. A shipped suite that
    # crashes on arrival is a broken artefact that reads green in the repo.
    #
    # NOTE ON HOW THIS LIST WORKS, measured 2026-11-05: a NON-EMPTY `include`
    # list RESTRICTS the sdist to the patterns in it. An EMPTY list means
    # "everything git tracks" — so emptying the list would ship MORE, not
    # fewer, and the list is not decorative. It is also not a glob list: the
    # entries are paths, and a directory entry ships the whole directory.
    "scripts/docs/",
    # The files README.md links to, because the sdist ships README.md AND ships
    # the gate that checks it — and that gate FAILED on the sdist it shipped in:
    # 4 hard D001 findings, because AGENTS.md, docs/RUNBOOK.md,
    # docs/ARCHITECTURE.md and assets/genome-wake.png were not in the sdist.
    # Measured 2026-11-05; the closure is 4 files, 84018 bytes, and it closes
    # in one round with 0 findings remaining. Shipping the README without what
    # it points at is the same defect one level up: a document that reads
    # green in the repo and is broken for anyone who extracts it.
    "AGENTS.md",
    "assets/genome-wake.png",
    "docs/ARCHITECTURE.md",
    "docs/RUNBOOK.md",
    "src/",
    "blueprints/",
    "references/",
    "docs/PUBLISHING.md",
    "SKILL.md",
    "README.md",
    "LICENSE",
    "FUNDING.yml",
    "install.sh",
    "install.ps1",
    "pyproject.toml",
]
