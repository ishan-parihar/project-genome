# genome.toml — modules on, role → path map, module settings. Edit freely.
[genome]
schema_version = 2
modules = ["core", "records", "integrity"]

[paths]
agents = "AGENTS.md"
state = "docs/handoff/STATE.md"
entry = "docs/handoff/README.md"
register = "TODO.md"
ledger = "docs/kb/CLOSED.md"
worklog = "docs/kb/WORKLOG.md"
asks = "docs/kb/ASKS.md"
plans = "docs/plans"
audits = "docs/audit"
runbook = "docs/RUNBOOK.md"
archive = "docs/archive"
readme = "README.md"
docs = "docs"
decisions = "docs/decisions"
regressions = "docs/regressions"
records_index = "docs/RECORDS.md"

[core]
gate = "uv build --wheel --sdist >/dev/null && python3 scripts/test_genome.py && python3 scripts/test_package.py && python3 scripts/test_package_modes.py && python3 scripts/check_docs_lint.py && python3 scripts/check_suite_counts.py && python3 scripts/build.py --check && python3 scripts/check_ps1.py && python3 scripts/genome lint --code E306 E308 E309 E651 E653 E654 E655 E656 E657 E658 --all"
# The gate `genome close` runs. Suite-only on purpose: it must pass in a few minutes and need
# nothing but the stdlib, so it runs before every push. The structure checks (E306 layout,
# E308 a directory name, E309 tracked-and-ignored) are gated too, because a misplaced file
# must not be able to reach the commit `close` names. The full verification adds the
# remaining `python3 scripts/genome lint`, `python3 scripts/genome doctor`, and for a
# release `uv build` first (the packaging suites install the BUILT artefacts in dist/).
worklog_form = "file"      # or "numbered" (worklog = a directory of NNNN-date-slug.md + INDEX.md)
archive_form = "flat"      # or "generations" (archive/<generation>/ + README manifest, no tombstones)
living_plans = []          # plans that evolve (phase rows, a 'Resume here' section)
# resume = "docs/plans/<living-plan>.md#Resume here"   # what `genome wake` shows
budgets = {}               # e.g. { "AGENTS.md" = 60000 } — bytes; entry surfaces stay cheap to read
emitters = []              # extra commands `genome close` runs to regenerate derived files
checklist = []             # judgement items `genome close` reminds you of
never_commit = []          # globs `genome close` leaves out of the named-path commit list

[records]
prefix = ""                # e.g. "PQF" → PQF-AD-001
mode = "immutable"         # or "amendable" (dated ## Amendment sections)

# This repo's integrity law. A Python CLI whose checks are its own test suite, so the
# gate above already runs them; declaring them here is what makes `genome lint --only
# integrity` answer the same question in one command instead of a shell string.
[app]
toolchain = "python"
build = "python3 scripts/build.py --check"
test = "python3 scripts/test_genome.py"
lint = "python3 scripts/check_ps1.py"

[docs]
required = ["README.md", "AGENTS.md", "docs/ARCHITECTURE.md"]
sections = { "docs/ARCHITECTURE.md" = ["Modules", "Commands"] }
max_lines = 600

[ops]
dir_globs = ["docs/plans", "docs/audit", "docs/decisions", "docs/regressions"]
