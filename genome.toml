# genome.toml — modules on, role → path map, module settings. Edit freely.
[genome]
schema_version = 2
modules = ["core", "records"]

[paths]
agents = "AGENTS.md"
state = "docs/handoff/STATE.md"
entry = "docs/handoff/README.md"
register = "TODO.md"
ledger = "docs/kb/CLOSED.md"
worklog = "docs/kb/WORKLOG.md"
asks = "docs/kb/ASKS.md"
plans = "docs/plans"
audits = "docs/audit"
runbook = "docs/RUNBOOK.md"
archive = "docs/archive"
readme = "README.md"
docs = "docs"
decisions = "docs/decisions"
regressions = "docs/regressions"
records_index = "docs/RECORDS.md"

[core]
gate = "python3 scripts/test_genome.py && python3 scripts/test_package.py && python3 scripts/test_package_modes.py && python3 scripts/build.py --check && python3 scripts/check_ps1.py"
# The gate `genome close` runs. Suite-only on purpose: it must pass in a few minutes and need
# nothing but the stdlib, so it runs before every push. The full verification adds
# `python3 scripts/genome lint`, `python3 scripts/genome doctor`, and for a release
# `uv build` first (the packaging suites install the BUILT artefacts in dist/).
worklog_form = "file"      # or "numbered" (worklog = a directory of NNNN-date-slug.md + INDEX.md)
archive_form = "flat"      # or "generations" (archive/<generation>/ + README manifest, no tombstones)
living_plans = []          # plans that evolve (phase rows, a 'Resume here' section)
# resume = "docs/plans/<living-plan>.md#Resume here"   # what `genome wake` shows
budgets = {}               # e.g. { "AGENTS.md" = 60000 } — bytes; entry surfaces stay cheap to read
emitters = []              # extra commands `genome close` runs to regenerate derived files
checklist = []             # judgement items `genome close` reminds you of
never_commit = []          # globs `genome close` leaves out of the named-path commit list

[records]
prefix = ""                # e.g. "PQF" → PQF-AD-001
mode = "immutable"         # or "amendable" (dated ## Amendment sections)
